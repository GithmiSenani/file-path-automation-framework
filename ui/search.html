<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Process Checker - Search</title>
  <style>
    :root {
      --background: #f8f9fa; /* Light gray background */
      --surface: #ffffff;    /* Card/surface color */
      --primary: #4a90e2;     /* A friendly, accessible blue */
      --text-primary: #212529; /* Dark gray for primary text */
      --secondary: #6c757d;   /* Muted gray for secondary text */
      --border-color: #dee2e6; /* Standard border color */
      --success: #198754;
      --success-light: #d1e7dd;
      --error: #dc3545;
      --error-light: #f8d7da;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; 
      background-color: var(--background);
      min-height: 100vh;
      padding: 2rem;
      margin: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .container {
      max-width: 700px;
      width: 100%;
      background: var(--surface);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      padding: 3rem;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .header h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }
    .header p {
      color: var(--secondary);
      font-size: 1rem;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #495057;
      font-weight: 600;
      font-size: 0.95rem;
    }
    input[type="text"] {
      width: 100%;
      padding: 0.875rem 1rem;
      font-size: 1rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      transition: all 0.2s;
      background: #f8f9fa;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
      background: var(--surface);
      box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
    }
    .btn {
      width: 100%;
      padding: 1rem;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover:not(:disabled) {
      background: #3a7ac8;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
    }
    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .status {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 8px;
      text-align: center;
      display: none;
    }
    .status.show {
      display: block;
    }
    .status.loading {
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--primary);
    }
    .status.success {
      background: var(--success-light);
      color: var(--success);
      border: 1px solid var(--success);
    }
    .status.error {
      background: var(--error-light);
      color: var(--error);
      border: 1px solid var(--error);
    }
    .spinner {
      border: 3px solid rgba(74, 144, 226, 0.3);
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      display: inline-block;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container" style="max-width: 800px;">
    <div class="header">
      <h1>🔍 Process Checker</h1>
      <p>Automated parallel search on ProcessChecker.com</p>
    </div>

    <form id="searchForm">
      <div class="form-group">
        <label for="processName">Add Process Names (Max 10)</label>
        <p style="font-size: 0.875rem; color: #6c757d; margin-bottom: 0.5rem;">Paste process names one per line or separated by commas, then click "Search All Processes".</p>
        <textarea 
          id="processName" 
          name="processName" 
          rows="10"
          placeholder="Enter process names here..."
          autofocus
          style="width: 100%; padding: 0.875rem 1rem; font-size: 1rem; border: 1px solid var(--border-color); border-radius: 8px; transition: all 0.2s; background: #f8f9fa; font-family: monospace; resize: none;"
        ></textarea>
        <style>
          textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--surface);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
          }
        </style>
      </div>

      <div style="background: #f0f7ff; border: 1px solid #b3d9ff; border-radius: 8px; padding: 0.75rem; margin-bottom: 1rem;">
        <p style="font-weight: 600; color: var(--primary); margin-bottom: 0.5rem; font-size: 0.9rem;">📋 Example:</p>
        <div style="background: white; border: 1px solid var(--border-color); border-radius: 6px; padding: 0.5rem; font-family: monospace; font-size: 0.8rem; color: #333; line-height: 1.4;">
chrome<br/>
notepad<br/>
svchost<br/>
explorer<br/>
winsvc
        </div>
      </div>

      <button type="submit" class="btn btn-primary" id="searchBtn">
        <span id="btnText">🚀 Search All Processes</span>
      </button>
    </form>

    <div class="status" id="status"></div>
  </div>

  <script>
    const form = document.getElementById('searchForm');
    const processInput = document.getElementById('processName');
    const searchBtn = document.getElementById('searchBtn');
    const btnText = document.getElementById('btnText');
    const statusDiv = document.getElementById('status');

    const MAX_PROCESSES = 10;

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      
      let input = processInput.value.trim();
      if (!input) {
        showStatus('Please enter process names', 'error');
        return;
      }

      // Split by commas OR newlines and trim each name
      let names = input.split(/[\n,]+/).map(name => name.trim()).filter(name => name.length > 0);

      if (names.length === 0) {
        showStatus('Please enter valid process names', 'error');
        return;
      }

      let processList = [];
      let skippedCount = 0;

      for (let name of names) {
        if (processList.length >= MAX_PROCESSES) {
          showStatus(`Maximum ${MAX_PROCESSES} processes reached. ${names.length - processList.length - skippedCount} names were not added.`, 'error');
          break;
        }

        // Automatically append .exe if not already present
        if (!name.toLowerCase().endsWith('.exe')) {
          name += '.exe';
        }

        // Check for duplicates
        if (processList.includes(name.toLowerCase())) {
          skippedCount++;
          continue;
        }

        processList.push(name.toLowerCase());
      }

      if (processList.length === 0) {
        showStatus('Please enter valid process names', 'error');
        return;
      }

      searchBtn.disabled = true;
      btnText.innerHTML = '<span class="spinner"></span> Searching...';
      showStatus(`Starting search for ${processList.length} process(es)...`, 'loading');

      try {
        const response = await fetch('/api/search-parallel', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ processes: processList })
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({ error: 'An unknown server error occurred.' }));
          throw new Error(errorData.error || `HTTP error! Status: ${response.status}`);
        }

        const data = await response.json();

        if (data.success) {
          showStatus('✅ Search completed! Results are opening in new tabs...', 'success');
          processInput.value = '';
          searchBtn.disabled = false;
          btnText.textContent = '🚀 Search All Processes';
        } else {
          throw new Error(data.message || 'The search failed on the server.');
        }

      } catch (error) {
        console.error('Error during search:', error);
        showStatus(`❌ Error: ${error.message}`, 'error');
        searchBtn.disabled = false;
        btnText.textContent = '🚀 Search All Processes';
      }
    });

    function showStatus(message, type) {
      statusDiv.textContent = message;
      statusDiv.className = `status show ${type}`;
    }
  </script>
</body>
</html>
