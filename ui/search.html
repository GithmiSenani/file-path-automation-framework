<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Process Checker - Search</title>
  <style>
    :root {
      --background: #f8f9fa; /* Light gray background */
      --surface: #ffffff;    /* Card/surface color */
      --primary: #4a90e2;     /* A friendly, accessible blue */
      --text-primary: #212529; /* Dark gray for primary text */
      --secondary: #6c757d;   /* Muted gray for secondary text */
      --border-color: #dee2e6; /* Standard border color */
      --success: #198754;
      --success-light: #d1e7dd;
      --error: #dc3545;
      --error-light: #f8d7da;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; 
      background-color: var(--background);
      min-height: 100vh;
      padding: 0;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: var(--surface);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      padding: 3rem;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .header h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }
    .header p {
      color: var(--secondary);
      font-size: 1rem;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #495057;
      font-weight: 600;
      font-size: 0.95rem;
    }
    input[type="text"] {
      width: 100%;
      padding: 0.875rem 1rem;
      font-size: 1rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      transition: all 0.2s;
      background: #f8f9fa;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
      background: var(--surface);
      box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
    }
    .btn {
      width: 100%;
      padding: 1rem;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover:not(:disabled) {
      background: #3a7ac8;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
    }
    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .status {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 8px;
      text-align: center;
      display: none;
    }
    .status.show {
      display: block;
    }
    .status.loading {
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--primary);
    }
    .status.success {
      background: var(--success-light);
      color: var(--success);
      border: 1px solid var(--success);
    }
    .status.error {
      background: var(--error-light);
      color: var(--error);
      border: 1px solid var(--error);
    }
    .spinner {
      border: 3px solid rgba(74, 144, 226, 0.3);
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      display: inline-block;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔍 Process Investigator</h1>
      <p>Automated search on ProcessChecker.com</p>
    </div>

    <form id="searchForm">
      <div class="form-group">
        <label for="processName">Process Name</label>
        <p style="font-size: 0.875rem; color: #6c757d; margin-bottom: 0.5rem;">Enter the process name to begin.</p>
        <div style="position: relative;">
          <input 
            type="text" 
            id="processName" 
            name="processName" 
            placeholder="e.g., svchost.exe, chrome.exe"
            required
            autofocus
            style="padding-right: 50px;"
          />
          <span style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); color: #6c757d; font-weight: 600; pointer-events: none;">.exe</span>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" id="searchBtn">
        <span id="btnText">🚀 Search Process</span>
      </button>
    </form>

    <div class="status" id="status"></div>
  </div>

  <script>
    const form = document.getElementById('searchForm');
    const processInput = document.getElementById('processName');
    const searchBtn = document.getElementById('searchBtn');
    const btnText = document.getElementById('btnText');
    const statusDiv = document.getElementById('status');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      
      let processName = processInput.value.trim();
      if (!processName) {
        showStatus('Please enter a process name', 'error');
        return;
      }

      // Automatically append .exe if not already present
      if (!processName.toLowerCase().endsWith('.exe')) {
        processName += '.exe';
      }

      // Disable form
      searchBtn.disabled = true;
      btnText.innerHTML = '<span class="spinner"></span> Searching...';
      showStatus('Starting automated search... This may take 30-60 seconds.', 'loading');

      try {
        const response = await fetch('/api/search', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ processName })
        });

        const data = await response.json();

        if (data.success) {
          showStatus(`✅ Search started for "${processName}"! A new browser tab will open with results.`, 'success');
          
          // Reset form after 3 seconds
          setTimeout(() => {
            searchBtn.disabled = false;
            btnText.textContent = '🚀 Search Process';
            processInput.value = '';
            statusDiv.classList.remove('show');
            processInput.focus();
          }, 3000);
        } else {
          throw new Error(data.error || 'Search failed');
        }
      } catch (error) {
        showStatus(`❌ Error: ${error.message}`, 'error');
        searchBtn.disabled = false;
        btnText.textContent = '🚀 Search Process';
      }
    });

    function showStatus(message, type) {
      statusDiv.textContent = message;
      statusDiv.className = `status show ${type}`;
    }
  </script>
</body>
</html>
